services:
  postgres:
    image: postgres:17
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    env_file: .env
    restart: unless-stopped
    container_name: "passproof"
    volumes:
      - ./src:/app/src
    ports:
      - "8765:8765"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data: